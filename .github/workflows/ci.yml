name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macos-15's default Xcode is 16.4 (Swift 6.1), the oldest Swift GRDB 7.12 builds with.
    # GitHub retired its macOS 14 runners on 2026-11-02, so the app's macOS 14 floor cannot be run here.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test
